services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qupi
      POSTGRES_PASSWORD: qupi
      POSTGRES_DB: qupi
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qupi"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
